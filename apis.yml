name: Slidebean
description: >-
  Slidebean is a pitch deck and financial modeling platform for startup
  founders. It combines AI-powered presentation software that auto-designs
  investor-ready slides with professional pitch deck design services and
  financial modeling assistance for fundraising. Founders use Slidebean to
  build, refine, and share pitch decks, model their startup finances, and
  prepare for investor conversations. As of this enrichment pass Slidebean
  operates as a consumer/SMB SaaS product and does not publish a public
  developer API, OpenAPI specification, SDKs, or developer portal; its GitHub
  organization contains only forks and small internal JavaScript utilities.
